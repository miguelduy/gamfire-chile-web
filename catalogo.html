<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo | Gamfire Chile</title>
</head>

<body>
    <div id="app">
        <main class="page-content py-lg">
            <div class="container">
                <h1>Catálogo de Productos</h1>

                <div class="catalog-controls">
                    <!-- Filter buttons could go here -->
                    <button class="btn btn-outline" style="color: black; border-color: #333;">Todos</button>
                    <button class="btn btn-outline" style="color: black; border-color: #333;">Protección</button>
                    <button class="btn btn-outline" style="color: black; border-color: #333;">Herramientas</button>
                </div>

                <div class="product-grid" id="catalog-grid">
                    <!-- Items injected via JS in the future, hardcoded demo for now -->
                    <div class="product-card">
                        <div class="product-img-placeholder"></div>
                        <h3>Casco F1</h3>
                        <span class="category">Protección</span>
                        <p>Casco estructural de alto rendimiento.</p>
                    </div>
                    <div class="product-card">
                        <div class="product-img-placeholder"></div>
                        <h3>Chaqueta Normada</h3>
                        <span class="category">Ropa</span>
                        <p>Chaqueta con barrera de vapor y térmica.</p>
                    </div>
                    <div class="product-card">
                        <div class="product-img-placeholder"></div>
                        <h3>Linterna de Pecho</h3>
                        <span class="category">Accesorios</span>
                        <p>Iluminación manos libres LED.</p>
                    </div>
                    <div class="product-card">
                        <div class="product-img-placeholder"></div>
                        <h3>Era (Equipo Respiración)</h3>
                        <span class="category">Protección</span>
                        <p>Equipo de respiración autónoma ligero.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
