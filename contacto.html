<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto | Gamfire Chile</title>
</head>

<body>
    <div id="app">
        <main class="page-content py-lg">
            <div class="container contact-container">
                <h1>Contáctanos</h1>
                <div class="contact-grid">
                    <div class="contact-info">
                        <h3>Información</h3>
                        <p>Si tienes dudas sobre stock o envíos, escríbenos directamente.</p>
                        <br>
                        <p><strong>Instagram:</strong> <a href="https://instagram.com/gamfire.chile">@gamfire.chile</a>
                        </p>
                        <p><strong>Email:</strong> gamfirechile@gmail.com</p>
                        <br>
                        <div class="map-placeholder"
                            style="background:#eee; height: 200px; display:flex; align-items:center; justify-content:center;">
                            Mapa de ubicación
                        </div>
                    </div>

                    <p>Entendido. Como alternativa simple sin servicios externos, el formulario abrirá tu cliente de
                        correo.</p>
                    <form class="contact-form" action="mailto:gamfirechile@gmail.com" method="post"
                        enctype="text/plain">
                        <div class="form-group">
                            <label for="name">Nombre</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Correo Electrónico</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="message">Mensaje</label>
                            <textarea id="message" name="message" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Enviar Mensaje</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
